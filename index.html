<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Личный якорь</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Arial,"Segoe UI",sans-serif;color:#183b70}
body{padding:8px}
.wrap{width:100%;max-width:1600px;margin:auto;background:#e9f6ff;border-radius:24px;overflow:hidden}
.header{display:flex;gap:22px;align-items:flex-start;padding:28px 32px 22px}
.icon{width:70px;height:70px;min-width:70px;border-radius:50%;background:#1677e8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:37px}
h1{margin:0 0 10px;color:#1474df;font-size:28px;text-transform:uppercase;letter-spacing:.4px}
.header p{margin:3px 0;font-size:20px;line-height:1.35}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:0 22px 20px}
.anchor-card{appearance:none;border:3px solid transparent;border-radius:18px;background:rgba(255,255,255,.82);padding:15px 10px 16px;min-height:300px;cursor:pointer;text-align:center;position:relative;display:flex;flex-direction:column;justify-content:space-between;transition:.2s;box-shadow:none;color:inherit}
.anchor-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(31,100,170,.12)}
.anchor-card.selected{border-color:#1677e8;background:#f7fbff;box-shadow:0 0 0 3px rgba(22,119,232,.12)}
.anchor-card.selected::after{content:"✓";position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:#1677e8;color:white;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.anchor-image{width:100%;height:155px;object-fit:contain;display:block;margin-bottom:8px}
.anchor-card-title{font-size:19px;line-height:1.25}
.bottom{padding:0 22px 28px}
.custom{background:rgba(255,255,255,.55);border-radius:18px;padding:20px;display:flex;align-items:center;gap:20px}
.q{width:65px;height:65px;min-width:65px;border-radius:50%;background:#1677e8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold}
.prompt{flex:0 0 45%}
.prompt strong{display:block;font-size:21px;margin-bottom:7px;color:#102e5d}
.prompt span{font-size:18px;line-height:1.3;color:#31517e}
input{flex:1;height:65px;border:2px solid #b8c8dc;border-radius:15px;background:white;padding:0 22px;font-size:18px;color:#183b70;outline:none}
input:focus{border-color:#1677e8;box-shadow:0 0 0 3px rgba(22,119,232,.12)}
input::placeholder{color:#9ba9bb}
.result{display:none;margin-top:12px;padding:12px 18px;border-radius:12px;background:#dff2ff;font-size:16px;line-height:1.45}
.result.show{display:block}
@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}.prompt{flex:1}}
@media(max-width:650px){.header{padding:20px}h1{font-size:22px}.header p{font-size:16px}.cards{grid-template-columns:repeat(2,1fr);padding:0 12px 15px}.anchor-card{min-height:245px}.anchor-card-title{font-size:16px}.custom{flex-direction:column;align-items:stretch}.q{align-self:flex-start}input{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="icon">🎯</div>
    <div>

      <p>Отметьте то, что откликается вам, или добавьте свой вариант.</p>

  <div class="bottom">
    <div class="custom">
      <div class="q">?</div>
      <div class="prompt">
        <strong>А теперь напишите:</strong>
        <span>Какой будет ваш личный якорь? В какой ситуации вы будете его использовать?</span>
      </div>
      <input id="customAnchor" type="text" placeholder="Мой якорь..." />
    </div>
    <div id="result" class="result"></div>
  </div>
</div>

<script>
(function(){
  const cards=[...document.querySelectorAll('.anchor-card')];
  const input=document.getElementById('customAnchor');
  const result=document.getElementById('result');

  function update(){
    const selected=cards.filter(c=>c.classList.contains('selected')).map(c=>c.dataset.name);
    const custom=input.value.trim();
    if(custom) selected.push('Свой вариант: '+custom);
    if(selected.length){
      result.innerHTML='<strong>Ваши якоря:</strong><br>'+selected.map(x=>escapeHtml(x)).join('<br>');
      result.classList.add('show');
    }else{
      result.classList.remove('show');
    }
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
  cards.forEach(card=>card.addEventListener('click',()=>{card.classList.toggle('selected');update()}));
  input.addEventListener('input',update);
})();
</script>
